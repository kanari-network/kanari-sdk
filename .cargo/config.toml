[build]
jobs = 8           # Adjust to match your CPU core count
incremental = true

rustflags = [
    "-W",
    "clippy::all",
    "-W",
    "clippy::pedantic",
    "-W",
    "clippy::nursery",
]

[target.'cfg(debug_assertions)']
rustflags = ["-W", "clippy::dbg_macro", "-W", "clippy::print_stdout"]

# Do not force `-C target-cpu=native` in workspace defaults. CI/release
# artifacts must be portable across CPUs, and recent nightly codegen has hit
# ICEs while compiling dependencies with native CPU flags. Benchmark scripts can
# still opt in by setting RUSTFLAGS explicitly on the benchmarking machine.

[net]
git-fetch-with-cli = true # Can be faster for git dependencies

[alias]
a = "add"
au = "audit"
b = "build"
br = "build --release"
c = "check"
cl = "clean"
d = "doc --open"
r = "run"
rr = "run --release"
up = "update"

kb = "build -p kanari"            # Build kanari package
kbr = "build -p kanari --release" # Build kanari package in release mode
kr = "run -p kanari"              # Run kanari package
krr = "run -p kanari --release"   # Run kanari package in release mode
