name: Kanari Nightly State and Network Hardening

on:
  schedule:
    - cron: "43 21 * * *"
  workflow_dispatch:
    inputs:
      campaign_hours:
        description: "Hours for repeated boundary/property campaign"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  state-network-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kanari-hardening-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            kanari-hardening-${{ runner.os }}-

      - name: Persistent SMT and storage tests
        run: |
          cargo test -p smt --all-targets
          cargo test -p kanari-move-runtime-v2 --lib compute_state_root_matches_materialized_sparse_root_for_rocksdb -- --test-threads=1
          cargo test -p kanari-rpc-server rpc_adversarial_inputs_are_rejected_without_server_error -- --test-threads=1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: RustSec dependency audit (report-only)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo audit --json > rustsec-audit.json
          audit_exit=$?
          echo "cargo audit exit code: $audit_exit (non-zero means advisories were found)"
          exit 0

      - name: Upload campaign logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanari-nightly-hardening-logs
          path: |
            .codex-runlogs
            target/**/build
            rustsec-audit.json

  fuzz-campaign:
    name: BCS/RPC/object/consensus/SMT campaign
    uses: ./.github/workflows/kanari-script-runner.yml
    with:
      script: scripts/run-fuzz-campaign.ps1
      args_json: >-
        ["-Hours","${{ github.event.inputs.campaign_hours || '1' }}","-Workers","2","-IncludeIgnoredLongRuns","-SkipClippy"]
      env_json: >-
        {"RUST_BACKTRACE":"1","KANARI_SMT_PROPTEST_CASES":"256"}
      cache_prefix: kanari-hardening
      timeout_minutes: 180
      artifact_name: kanari-nightly-hardening-campaign-logs
      artifact_path: .kanari-runlogs
