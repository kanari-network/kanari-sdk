# cargo-deny configuration: supply-chain gates for kanari-sdk.
# Run locally with `cargo deny check`, enforced in CI (`security-gates.yml`).
# Schema (cargo-deny 0.20): https://emboss.github.io/cargo-deny/
#
# Note: the `interactive-disassemble` cargo feature intentionally pulls in the
# unmaintained `tui` 0.19 crate, so it is kept OFF by default. This gate
# checks default features (what we ship); enabling that feature requires a
# separate risk sign-off.

[graph]
# Check the default feature set (what we ship).
all-features = false
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Vulnerabilities always fail the gate (no opt-out in cargo-deny >= 0.18).
# Fail on yanked crate versions.
yanked = "deny"
# Unmaintained advisories fail only when they hit a direct workspace
# dependency; transitive-only hits (e.g. via opt-in features) warn.
unmaintained = "workspace"
ignore = [
    # bincode: upstream ceased development (doxxing/harassment incident).
    # Serialization format is stable and the team considers 1.3.3 complete.
    # Revisit if a maintained fork appears. Used by kanari-frameworks,
    # kanari-node (2.0.1) and mysticeti (1.3.3).
    { id = "RUSTSEC-2025-0141", reason = "upstream ceased development; format stable, no maintained alternative yet" },
    # rsa: Marvin timing sidechannel (RUSTSEC-2023-0071), unpatched upstream
    # as of 2026-09. Used by kanari-crypto/kanari-core/kanari-system-natives
    # for non-network-facing key operations. Do NOT use for remotely-timed
    # decryption; migrate off `rsa` once RustCrypto ships constant-time fix.
    { id = "RUSTSEC-2023-0071", reason = "unpatched upstream; only used where attackers cannot observe timing" },
]

[bans]
# Duplicate crate versions warn (e.g. crossterm 0.25 via `tui` alongside
# 0.29) so we notice drift, without failing the build.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
# Permissive licenses allowed everywhere in the dependency tree.
# (Crates without any license info fail by default; in-repo crates now all
# declare `license.workspace`, so no clarify entries are needed.)
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "0BSD",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Weak-copyleft / data-only licenses, allowed per-crate with justification.
# (File-level copyleft does not propagate to the binary; data crates carry
# no executable code under the license.)
exceptions = [
    # roaring-bitmap impl detail, file-level copyleft only.
    { allow = ["MPL-2.0"], crate = "bitmaps@2.1.0" },
    # CLI color helper, file-level copyleft only.
    { allow = ["MPL-2.0"], crate = "colored@3.1.1" },
    # immutable-collections dep, file-level copyleft only.
    { allow = ["MPL-2.0"], crate = "im@15.1.0" },
    # path helper pulled in via dirs, file-level copyleft only.
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    # UEFI type definitions only, no linked logic under LGPL.
    { allow = ["MIT", "Apache-2.0", "LGPL-2.1-or-later"], crate = "r-efi@5.3.0" },
    { allow = ["MIT", "Apache-2.0", "LGPL-2.1-or-later"], crate = "r-efi@6.0.0" },
    # im impl detail, file-level copyleft only.
    { allow = ["MPL-2.0"], crate = "sized-chunks@0.6.5" },
    # Build-time FFI scaffolding pulled in via flutter_rust_bridge,
    # file-level copyleft only.
    { allow = ["MPL-2.0"], crate = "uniffi@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_build@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_core@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline@0.32.2" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl@0.32.2" },
    # Mozilla CA bundle data only, no executable code under CDLA.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs@1.0.9" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
# Only allow crates.io; other registries/git sources must be added explicitly.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
