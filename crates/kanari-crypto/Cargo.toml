[package]
name = "kanari-crypto"
edition.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
bip39.workspace = true
# Core crypto libraries
k256 = { workspace = true, features = ["ecdsa", "std"] }
p256 = { workspace = true, features = ["ecdsa", "std"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
sha3.workspace = true
zstd.workspace = true

smallvec.workspace = true
sha2.workspace = true
secp256k1 = { workspace = true, features = ["recovery"] }


# Post-Quantum Cryptography (PQC) - NIST Standards
pqcrypto-dilithium.workspace = true  # Post-quantum signatures
pqcrypto-kyber.workspace = true     # Post-quantum key encapsulation
pqcrypto-sphincsplus.workspace = true # Hash-based signatures (ultra-secure)
pqcrypto-traits.workspace = true    # Common traits for PQC

# Make blake3 optional and enabled via the blake3 feature
blake3 = { workspace = true, optional = true }
bincode.workspace = true

# BIP32/BIP44 HD wallet support
bip32.workspace = true

rand.workspace = true
hex.workspace = true
serde_json = { workspace = true , default-features = true }
lazy_static.workspace = true
serde_yaml.workspace = true
toml.workspace = true
log.workspace = true
serde.workspace = true
thiserror.workspace = true
argon2.workspace = true
aes-gcm = "0.10.3"
base64 = "0.22.1"

# Time handling for audit logging
chrono = "0.4"

# Add common dependency

kanari-types.workspace = true
kanari-common.workspace = true
move-vm-runtime = { workspace = true }
move-vm-types = { workspace = true }
move-core-types = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

[features]
# keep blake3 optional in Cargo.toml but enable it in the crate default features
default = ["blake3", "pqc"]
pqc = []  # Post-quantum cryptography feature
hybrid = ["pqc"]  # Hybrid classical + PQC schemes