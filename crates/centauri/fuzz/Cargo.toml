[package]
name = "centauri-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# This fuzz crate is intentionally excluded from the workspace
# It uses libfuzzer-sys which requires separate compilation
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
centauri = { path = ".." }

[[bin]]
name = "fuzz_vertex_validation"
path = "fuzz_targets/fuzz_vertex_validation.rs"
test = false
doc = false

[[bin]]
name = "fuzz_consensus_rounds"
path = "fuzz_targets/fuzz_consensus_rounds.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sync_protocol"
path = "fuzz_targets/fuzz_sync_protocol.rs"
test = false
doc = false

[[bin]]
name = "fuzz_byzantine_detection"
path = "fuzz_targets/fuzz_byzantine_detection.rs"
test = false
doc = false

[[bin]]
name = "fuzz_committee_transitions"
path = "fuzz_targets/fuzz_committee_transitions.rs"
test = false
doc = false
